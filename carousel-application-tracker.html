<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=480,initial-scale=1"/>
  <title>Application Tracker — My Pathfinder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
  *{margin:0;padding:0;box-sizing:border-box}
  @keyframes at-fade-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes at-row-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes at-check-pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  @keyframes at-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @keyframes at-cursor-blink{0%,100%{opacity:1}50%{opacity:0}}
  @keyframes at-modal-in{from{opacity:0;transform:scale(0.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes at-badge-flash{0%{transform:scale(0.8);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  @keyframes shimmer-border{0%{background-position:100% 50%}100%{background-position:-100% 50%}}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:transparent;padding:20px}
  .at-shimmer-wrap{border-radius:22px;padding:2px;background:linear-gradient(90deg,hsl(270,80%,55%) 0%,hsl(290,70%,50%) 25%,hsl(250,80%,60%) 50%,hsl(300,80%,70%) 60%,hsl(250,80%,60%) 70%,hsl(290,70%,50%) 85%,hsl(270,80%,55%) 100%);background-size:200% 100%;animation:shimmer-border 3s ease-in-out infinite;box-shadow:0 25px 50px rgba(91,33,182,0.2),0 12px 24px rgba(0,0,0,0.1)}
  .at-card{width:480px;height:560px;border-radius:20px;overflow:hidden;background:#fff;display:flex;flex-direction:column;position:relative}
  </style>
  </head>
  <body>
  <div class="at-shimmer-wrap">
  <div class="at-card">
    <!-- Header -->
    <div style="background:linear-gradient(135deg,#6d28d9 0%,#4c1d95 50%,#1a0a3e 100%);padding:1rem 1.25rem;display:flex;align-items:center;gap:0.75rem;position:relative;overflow:hidden;flex-shrink:0">
      <div style="position:absolute;top:-60%;right:-20%;width:250px;height:250px;background:radial-gradient(circle,rgba(186,103,239,0.2) 0%,transparent 70%);pointer-events:none"></div>
      <div style="width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
      </div>
      <div style="position:relative;z-index:1">
        <h4 style="font-size:1.1rem;font-weight:700;color:#fff;margin:0">Application Tracker</h4>
        <p style="font-size:0.72rem;color:rgba(255,255,255,0.6);margin:0">Track your job applications</p>
      </div>
      <button id="atAddBtn" style="margin-left:auto;padding:6px 12px;border-radius:8px;border:none;background:rgba(255,255,255,0.15);color:#fff;font-weight:600;font-size:0.72rem;cursor:pointer;display:flex;align-items:center;gap:4px;position:relative;z-index:1;transition:all 200ms ease">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Job
      </button>
    </div>

    <!-- Stats Grid -->
    <div id="atStats" style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:10px 1.25rem 0;flex-shrink:0">
      <div style="padding:8px 6px;border-radius:8px;background:#ede9fe;text-align:center">
        <p id="statPrep" style="font-size:1.1rem;font-weight:800;color:#5b21b6;margin:0 0 1px">3</p>
        <p style="font-size:0.55rem;font-weight:600;color:#5b21b6;margin:0;opacity:0.8">Preparing</p>
      </div>
      <div style="padding:8px 6px;border-radius:8px;background:#dbeafe;text-align:center">
        <p id="statApplied" style="font-size:1.1rem;font-weight:800;color:#1e40af;margin:0 0 1px">2</p>
        <p style="font-size:0.55rem;font-weight:600;color:#1e40af;margin:0;opacity:0.8">Applied</p>
      </div>
      <div style="padding:8px 6px;border-radius:8px;background:#d1fae5;text-align:center">
        <p id="statShort" style="font-size:1.1rem;font-weight:800;color:#065f46;margin:0 0 1px">2</p>
        <p style="font-size:0.55rem;font-weight:600;color:#065f46;margin:0;opacity:0.8">Shortlisted</p>
      </div>
      <div style="padding:8px 6px;border-radius:8px;background:#fef3c7;text-align:center">
        <p id="statInterview" style="font-size:1.1rem;font-weight:800;color:#92400e;margin:0 0 1px">1</p>
        <p style="font-size:0.55rem;font-weight:600;color:#92400e;margin:0;opacity:0.8">Interviewing</p>
      </div>
    </div>

    <!-- Pipeline Bar -->
    <div style="padding:8px 1.25rem 0;flex-shrink:0">
      <div id="atPipeline" style="display:flex;border-radius:6px;overflow:hidden;height:8px;background:#f3f0fa"></div>
    </div>

    <!-- Rows -->
    <div style="flex:1;padding:8px 1.25rem 12px;overflow:hidden">
      <div id="atRows" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>

    <!-- Modal Overlay -->
    <div id="atModal" style="position:absolute;inset:0;z-index:20;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;padding:1rem">
      <div style="width:100%;max-width:380px;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.2);overflow:hidden;animation:at-modal-in 0.3s ease both">
        <div style="padding:14px 18px;border-bottom:1px solid #e9e5f5;display:flex;align-items:center;justify-content:space-between">
          <div><h5 style="margin:0;font-weight:700;color:#1e1b4b;font-size:0.92rem">Add New Application</h5><p style="margin:1px 0 0;font-size:0.68rem;color:#6b7280">Track a job you're applying for</p></div>
          <div style="width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:1rem">×</div>
        </div>
        <div style="padding:14px 18px">
          <div style="margin-bottom:10px"><label style="display:block;font-size:0.7rem;font-weight:600;color:#1e1b4b;margin-bottom:3px">Job Title</label><div id="fieldRole" style="width:100%;padding:8px 12px;border:2px solid #ddd6fe;border-radius:8px;font-size:0.82rem;color:#9ca3af;background:#fff;display:flex;align-items:center;transition:all 200ms ease">e.g. Product Manager</div></div>
          <div style="margin-bottom:10px"><label style="display:block;font-size:0.7rem;font-weight:600;color:#1e1b4b;margin-bottom:3px">Company</label><div id="fieldCompany" style="width:100%;padding:8px 12px;border:2px solid #ddd6fe;border-radius:8px;font-size:0.82rem;color:#9ca3af;background:#fff;display:flex;align-items:center;transition:all 200ms ease">e.g. Google</div></div>
          <div style="margin-bottom:10px"><label style="display:block;font-size:0.7rem;font-weight:600;color:#1e1b4b;margin-bottom:3px">Location</label><div id="fieldLocation" style="width:100%;padding:8px 12px;border:2px solid #ddd6fe;border-radius:8px;font-size:0.82rem;color:#9ca3af;background:#fff;display:flex;align-items:center;transition:all 200ms ease">e.g. London</div></div>
          <div style="margin-bottom:10px"><label style="display:block;font-size:0.7rem;font-weight:600;color:#1e1b4b;margin-bottom:3px">Status</label><div style="width:100%;padding:8px 12px;border:2px solid #ddd6fe;border-radius:8px;font-size:0.82rem;color:#7c3aed;font-weight:600;background:#f5f3ff;display:flex;align-items:center;justify-content:space-between">Preparing Application<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div></div>
          <button id="atSaveBtn" style="width:100%;padding:10px;border-radius:10px;border:none;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;font-weight:700;font-size:0.85rem;cursor:pointer;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 200ms ease">Save Application</button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script>
  const TYPING_ROLE='Senior Frontend Developer',TYPING_COMPANY='TechCorp',TYPING_LOCATION='London';
  const statusStyles={prep:{color:'#7c3aed',bg:'#f5f3ff'},appSent:{color:'#2563eb',bg:'#dbeafe'},shortListed:{color:'#059669',bg:'#d1fae5'},'1stInterview':{color:'#d97706',bg:'#fef3c7'},'2ndInterview':{color:'#ea580c',bg:'#ffedd5'},OfferAccepted:{color:'#059669',bg:'#d1fae5'},UnSuccessful:{color:'#dc2626',bg:'#fee2e2'}};
  const EXISTING=[{role:'Product Designer',company:'Spotify',location:'London',cv:true,applied:true,interview:true,status:'2nd Interview',sv:'2ndInterview'},{role:'UX Researcher',company:'Meta',location:'Remote',cv:true,applied:true,interview:false,status:'Shortlisted',sv:'shortListed'},{role:'Frontend Engineer',company:'Revolut',location:'Manchester',cv:true,applied:false,interview:false,status:'Preparing',sv:'prep'}];
  const phases=['tracker-idle','add-click','modal-open','modal-save','row-added','check-cv','check-applied','check-shortlisted','check-interview','status-update','pause'];
  let phase='tracker-idle',typedR=0,typedC=0,typedL=0;
  function checkSvg(s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';}
  function uncheckSvg(s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>';}
  function makeRow(r,isNew,cv,applied,interview,statusVal,statusLabel,highlight,anim){
    const st=statusStyles[statusVal]||statusStyles.prep;
    const border=highlight?'1.5px solid #ddd6fe':'1px solid #f0ebfa';
    const bg=highlight?'#faf8ff':'#fff';
    const shadow=highlight?'0 0 0 2px rgba(124,58,237,0.1)':'none';
    const animStyle=anim?'animation:at-row-in 0.5s ease both;':'';
    let checks='';
    [{l:'CV',c:cv},{l:'Applied',c:applied},{l:'Interview',c:interview}].forEach(x=>{
      const icon=x.c?'<span style="display:inline-flex;animation:at-check-pop 0.4s ease both">'+checkSvg(14)+'</span>':uncheckSvg(14);
      const clr=x.c?'#059669':'#9ca3af';
      checks+='<div style="display:flex;align-items:center;gap:3px">'+icon+'<span style="font-size:0.58rem;font-weight:500;color:'+clr+'">'+x.l+'</span></div>';
    });
    const badgeAnim=(statusVal==='1stInterview'&&isNew)?'animation:at-badge-flash 0.4s ease both;':'';
    return '<div style="padding:10px 12px;border-radius:10px;background:'+bg+';border:'+border+';display:flex;flex-direction:column;gap:6px;box-shadow:'+shadow+';transition:all 300ms ease;'+animStyle+'"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1"><p style="font-size:0.82rem;font-weight:600;color:#1e1b4b;margin:0">'+r.role+'</p><p style="font-size:0.68rem;color:#7c3aed;font-weight:600;margin:1px 0 0">'+r.company+' · '+r.location+'</p></div><span style="font-size:0.62rem;font-weight:600;padding:3px 8px;border-radius:100px;color:'+st.color+';background:'+st.bg+';transition:all 300ms ease;'+badgeAnim+'">'+statusLabel+'</span></div><div style="display:flex;align-items:center;gap:12px">'+checks+'</div></div>';
  }
  function getCounts(){
    const b={p:3,a:2,s:2,i:1};
    if(phase==='row-added'||phase==='check-cv')return{p:4,a:2,s:2,i:1};
    if(phase==='check-applied')return{p:3,a:3,s:2,i:1};
    if(phase==='check-shortlisted')return{p:3,a:2,s:3,i:1};
    if(phase==='check-interview'||phase==='status-update'||phase==='pause')return{p:3,a:2,s:2,i:2};
    return b;
  }
  function renderPipeline(){
    const c=getCounts(),tot=c.p+c.a+c.s+c.i;
    const stages=[{c:c.p,clr:'#7c3aed',bg:'#ede9fe'},{c:c.a,clr:'#2563eb',bg:'#dbeafe'},{c:c.s,clr:'#059669',bg:'#d1fae5'},{c:c.i,clr:'#d97706',bg:'#fef3c7'}];
    let h='';
    stages.forEach(s=>{if(s.c>0){h+='<div style="width:'+(s.c/tot*100)+'%;background:'+s.bg+';border-right:2px solid #fff;min-width:14px;display:flex;align-items:center;justify-content:center;transition:width 0.4s ease"><span style="font-size:0.45rem;font-weight:700;color:'+s.clr+'">'+s.c+'</span></div>';}});
    document.getElementById('atPipeline').innerHTML=h;
  }
  function renderStats(){
    const c=getCounts();
    document.getElementById('statPrep').textContent=c.p;
    document.getElementById('statApplied').textContent=c.a;
    document.getElementById('statShort').textContent=c.s;
    document.getElementById('statInterview').textContent=c.i;
  }
  function renderRows(){
    const showNew=['row-added','check-cv','check-applied','check-shortlisted','check-interview','status-update','pause'].includes(phase);
    const cv=['check-cv','check-applied','check-shortlisted','check-interview','status-update','pause'].includes(phase);
    const applied=['check-applied','check-shortlisted','check-interview','status-update','pause'].includes(phase);
    const interview=['check-interview','status-update','pause'].includes(phase);
    const isStatus=phase==='status-update'||phase==='pause';
    const afterApplied=['check-applied','check-shortlisted','check-interview','status-update','pause'].includes(phase);
    const sv=isStatus?'1stInterview':afterApplied?'shortListed':'prep';
    const sl=isStatus?'1st Interview':afterApplied?'Shortlisted':'Preparing Application';
    const highlight=phase==='check-interview'||isStatus;
    let h='';
    if(showNew){h+=makeRow({role:'Senior Frontend Developer',company:'TechCorp',location:'London'},true,cv,applied,interview,sv,sl,highlight,true);}
    EXISTING.forEach(r=>{h+=makeRow(r,false,r.cv,r.applied,r.interview,r.sv,r.status,false,false);});
    document.getElementById('atRows').innerHTML=h;
  }
  function setField(id,val,placeholder,active){
    const el=document.getElementById(id);
    const cursor=active?'<span style="display:inline-block;width:2px;height:1em;background:#8b5cf6;margin-left:1px;animation:at-cursor-blink 0.8s ease infinite"></span>':'';
    el.style.color=val?'#1e1b4b':'#9ca3af';
    el.style.borderColor=active?'#a78bfa':'#ddd6fe';
    el.style.boxShadow=active?'0 0 0 3px rgba(139,92,246,0.15)':'none';
    el.innerHTML=(val||placeholder)+cursor;
  }
  function render(){
    renderStats();renderPipeline();renderRows();
    const modal=document.getElementById('atModal');
    const btn=document.getElementById('atAddBtn');
    const saveBtn=document.getElementById('atSaveBtn');
    if(phase==='modal-open'||phase==='modal-save'){
      modal.style.display='flex';modal.style.animation='at-fade-in 0.2s ease both';
      setField('fieldRole',TYPING_ROLE.slice(0,typedR),'e.g. Product Manager',typedR>0&&typedR<TYPING_ROLE.length);
      setField('fieldCompany',TYPING_COMPANY.slice(0,typedC),'e.g. Google',typedC>0&&typedC<TYPING_COMPANY.length);
      setField('fieldLocation',TYPING_LOCATION.slice(0,typedL),'e.g. London',typedL>0&&typedL<TYPING_LOCATION.length);
      if(phase==='modal-save'){saveBtn.style.background='#059669';saveBtn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Saved!';}
      else{saveBtn.style.background='linear-gradient(135deg,#7c3aed,#6d28d9)';saveBtn.innerHTML='Save Application';}
    }else{modal.style.display='none';}
    if(phase==='add-click'){btn.style.background='#fff';btn.style.color='#7c3aed';btn.style.animation='at-pulse 0.6s ease';}
    else{btn.style.background='rgba(255,255,255,0.15)';btn.style.color='#fff';btn.style.animation='none';}
  }
  function tick(){
    if(phase==='modal-open'){
      if(typedR<TYPING_ROLE.length){typedR+=Math.floor(Math.random()*2)+1;if(typedR>TYPING_ROLE.length)typedR=TYPING_ROLE.length;render();setTimeout(tick,50);return;}
      if(typedC<TYPING_COMPANY.length){typedC+=Math.floor(Math.random()*2)+1;if(typedC>TYPING_COMPANY.length)typedC=TYPING_COMPANY.length;render();setTimeout(tick,60);return;}
      if(typedL<TYPING_LOCATION.length){typedL+=Math.floor(Math.random()*2)+1;if(typedL>TYPING_LOCATION.length)typedL=TYPING_LOCATION.length;render();setTimeout(tick,60);return;}
      setTimeout(()=>{phase='modal-save';render();setTimeout(()=>{phase='row-added';render();next();},600);},800);return;
    }
    next();
  }
  function next(){
    const timings={'tracker-idle':['add-click',2000],'add-click':['modal-open',800],'row-added':['check-cv',1500],'check-cv':['check-applied',1200],'check-applied':['check-shortlisted',1200],'check-shortlisted':['check-interview',1200],'check-interview':['status-update',1200],'status-update':['pause',2000]};
    if(phase==='pause'){setTimeout(reset,2500);return;}
    const n=timings[phase];
    if(n){setTimeout(()=>{phase=n[0];render();tick();},n[1]);}
  }
  function reset(){phase='tracker-idle';typedR=0;typedC=0;typedL=0;render();next();}
  render();next();
  </script>
  </body>
  </html>
