.ats-vibe-score {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  flex-shrink: 0;
  position: relative;
  background: transparent;
  border: none;
  transition: transform 0.2s ease;
}
.ats-vibe-score:hover {
  transform: scale(1.15);
}
.ats-vibe-score::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  padding: 2px;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  -webkit-mask-composite: xor;
}
.ats-vibe-score .vibe-number {
  font-size: 0.85rem;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.5px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 1;
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* COOL */
.ats-vibe-score.vibe-cool .vibe-number {
  background-image: linear-gradient(135deg, #a5b4fc, #c7d2fe);
  filter: drop-shadow(0 0 2px rgba(165, 180, 252, 0.2));
}
.ats-vibe-score.vibe-cool::before {
  background: conic-gradient(from 0deg, rgba(199,210,254,0.25), rgba(165,180,252,0.15), rgba(199,210,254,0.25));
  animation: ats-ring-spin 8s linear infinite;
}

/* WARM */
.ats-vibe-score.vibe-warm .vibe-number {
  background-image: linear-gradient(135deg, #c084fc, #a855f7, #8b5cf6);
  filter: drop-shadow(0 0 6px rgba(168,85,247,0.5)) drop-shadow(0 0 12px rgba(139,92,246,0.2));
  animation: ats-warm-number-breathe 2.5s ease-in-out infinite;
}
.ats-vibe-score.vibe-warm::before {
  background: conic-gradient(from 0deg, #c4b5fd, #a78bfa, #8b5cf6, #a78bfa, #c4b5fd);
  animation: ats-ring-spin 5s linear infinite;
}

/* HOT */
.ats-vibe-score.vibe-hot {
  animation: ats-hot-container-pulse 1.8s ease-in-out infinite;
}
.ats-vibe-score.vibe-hot .vibe-number {
  font-size: 0.9rem;
  background-image: linear-gradient(135deg, #fff, #f0abfc, #d946ef, #a855f7);
  background-size: 200% 200%;
  animation: ats-hot-shimmer 2s ease-in-out infinite;
  filter: drop-shadow(0 0 10px rgba(217,70,239,0.8))
         drop-shadow(0 0 20px rgba(168,85,247,0.5))
         drop-shadow(0 0 35px rgba(139,92,246,0.3));
}
.ats-vibe-score.vibe-hot::before {
  padding: 2.5px;
  background: conic-gradient(from 0deg, #f0abfc, #d946ef, #a855f7, #7c3aed, #a855f7, #d946ef, #f0abfc);
  animation: ats-ring-spin 1.5s linear infinite;
}

@keyframes ats-ring-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes ats-warm-number-breathe {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(168,85,247,0.4)) drop-shadow(0 0 10px rgba(139,92,246,0.15)); }
  50% { filter: drop-shadow(0 0 8px rgba(168,85,247,0.7)) drop-shadow(0 0 18px rgba(139,92,246,0.3)); }
}
@keyframes ats-hot-shimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes ats-hot-container-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.07); }
}
